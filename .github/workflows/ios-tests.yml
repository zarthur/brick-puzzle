name: iOS tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ios-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Xcode toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Test CI orchestration
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Select an iPhone simulator
        id: simulator
        run: python3 .github/scripts/ios_ci.py select-simulator

      - name: Build app and all test targets
        run: >-
          python3 .github/scripts/ios_ci.py build-for-testing
          --simulator-id "${{ steps.simulator.outputs.id }}"

      - name: Run unit tests
        run: >-
          python3 .github/scripts/ios_ci.py run-unit-tests
          --simulator-id "${{ steps.simulator.outputs.id }}"

      - name: Run UI tests
        run: >-
          python3 .github/scripts/ios_ci.py run-ui-tests
          --simulator-id "${{ steps.simulator.outputs.id }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrickPuzzle-test-results
          path: |
            ${{ runner.temp }}/BrickPuzzleTests.xcresult
            ${{ runner.temp }}/BrickPuzzleUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
